name: Android CI

on:
  push:
    branches: [ main, development ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, development ]
  workflow_dispatch:  # 允許手動觸發

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    # 還原共用 debug keystore，確保所有 CI build 簽名一致
    # 設定方式：將 debug.keystore 以 base64 -w 0 編碼後存入 Repository Secret DEBUG_KEYSTORE_BASE64
    - name: Restore shared debug keystore
      if: ${{ env.DEBUG_KEYSTORE_BASE64 != '' }}
      env:
        DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
      run: |
        mkdir -p ~/.android
        echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore

    # Gradle 官方 Action - 自動處理 wrapper 和快取
    # https://github.com/gradle/actions
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6

    # 若專案沒有 gradlew，先產生 wrapper
    - name: Generate Gradle Wrapper if missing
      run: |
        if [ ! -f "./gradlew" ]; then
          gradle wrapper --gradle-version=8.5
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x ./gradlew

    - name: Run lint check
      run: ./gradlew lintDebug

    - name: Run unit tests
      run: ./gradlew testDebugUnitTest

    - name: Build debug APK
      run: ./gradlew assembleDebug

    # W24c：debug artifact 檔名帶版號(versionName+versionCode)+時間(台北)+short sha，
    # 多版並存可辨識。版號從 build.gradle.kts 抽（單一來源，bump 不用動 workflow）
    - name: Compute build stamp
      id: stamp
      run: |
        V_NAME=$(sed -n 's/.*versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
        V_CODE=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts)
        echo "STAMP=v${V_NAME}-c${V_CODE}-$(TZ=Asia/Taipei date +%Y%m%d_%H%M)-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    - name: Rename debug APK with stamp
      run: |
        mv app/build/outputs/apk/debug/app-debug.apk \
           app/build/outputs/apk/debug/NotificationMaster-debug-${{ steps.stamp.outputs.STAMP }}.apk

    - name: Upload debug APK
      uses: actions/upload-artifact@v7
      with:
        name: NotificationMaster-debug-${{ steps.stamp.outputs.STAMP }}
        path: app/build/outputs/apk/debug/NotificationMaster-debug-*.apk
        retention-days: 14
        overwrite: true

    - name: Upload lint results
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: lint-results
        path: app/build/reports/lint-results-debug.html
        retention-days: 7

    - name: Upload test results
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: test-results
        path: app/build/reports/tests/testDebugUnitTest/
        retention-days: 7

  # Release APK (僅在建立 v* tag 時觸發)
  release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    permissions:
      contents: write  # 需要寫入權限來建立 release

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6

    - name: Generate Gradle Wrapper if missing
      run: |
        if [ ! -f "./gradlew" ]; then
          gradle wrapper --gradle-version=8.5
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x ./gradlew

    - name: Build release APK
      run: ./gradlew assembleRelease

    - name: Get version from tag
      id: version
      run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

    - name: Rename APK with version
      run: |
        mv app/build/outputs/apk/release/app-release-unsigned.apk \
           app/build/outputs/apk/release/NotificationMaster-${{ steps.version.outputs.VERSION }}-unsigned.apk

    # 使用 GitHub CLI (gh) 建立 Release - GitHub 官方工具
    # https://cli.github.com/
    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "${{ steps.version.outputs.VERSION }}" \
          --title "Release ${{ steps.version.outputs.VERSION }}" \
          --generate-notes \
          "app/build/outputs/apk/release/NotificationMaster-${{ steps.version.outputs.VERSION }}-unsigned.apk"
